[package]
name = "shoal-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
shoal-backends.workspace = true
shoal-protocol.workspace = true
futures-util = "0.3.34"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
hex = "0.4.3"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "signal", "test-util"] }
tracing-subscriber = "0.3.23"
