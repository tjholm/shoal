# Production-tier topology. Also serves as the local-dev peripherals stack.
#
# Local development:
#   docker compose up
# Brings up only peripheral services (Postgres now, Dragonfly/Redis later).
# Run the shoal server on the host with `bun run dev:server`, pointing at
# DATABASE_URL=postgres://shoal:shoal@localhost:5432/shoal.
#
# Prod-like full stack:
#   docker compose --profile full up
# Adds the shoal-server container, which connects to peripherals by service
# name (postgres, dragonfly).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shoal
      POSTGRES_PASSWORD: shoal
      POSTGRES_DB: shoal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoal -d shoal"]
      interval: 5s
      timeout: 3s
      retries: 10

  shoal:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/server/server.dockerfile
    image: shoal:dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://shoal:shoal@postgres:5432/shoal
      SHOAL_APP_URL: http://localhost:3000
      SHOAL_SERVER_URL: http://localhost:3000

  # Reserved for the dispatcher's distributed state when that work lands.
  # Uncomment to enable; expose at localhost:6379 for host-side dev.
  #
  # dragonfly:
  #   image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - dragonfly-data:/data
  #   ulimits:
  #     memlock: -1

volumes:
  postgres-data:
  # dragonfly-data:
