[package]
name = "shoal-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
shoal-worker.workspace = true
async-channel = "2.5.0"
auto-launch = "0.6.0"
dirs = "7.0.0"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = { version = "=0.26.1", default-features = false }
unicode-segmentation = "1.13.3"
keyring-core = "1.0.1"
resvg = { version = "0.45.1", default-features = false }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSRunningApplication"] }

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1.1.0"
