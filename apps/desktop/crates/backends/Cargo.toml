[package]
name = "shoal-backends"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
