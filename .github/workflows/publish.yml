name: release

on:
  push:
    tags: ['v*']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: |
          bunx tsc --noEmit
          bunx tsc --noEmit -p apps/server
          bunx tsc --noEmit -p apps/web
      - name: Test
        run: bun test --pass-with-no-tests

  release-cli:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # --- npm bundle ---
      - name: Build npm bundle
        run: |
          mkdir -p dist/npm
          bun build apps/cli/bin.ts \
            --target=node \
            --outfile=dist/npm/shoal.js \
            --minify \
            --banner='#!/usr/bin/env node'
          chmod +x dist/npm/shoal.js

      - name: Write publish package.json
        run: |
          cat > dist/npm/package.json <<EOF
          {
            "name": "@shoal.sh/cli",
            "version": "${{ steps.version.outputs.version }}",
            "license": "MIT",
            "type": "module",
            "bin": { "shoal": "shoal.js" },
            "engines": { "node": ">=22" }
          }
          EOF

      - name: Publish to npm
        run: cd dist/npm && npm publish --access public

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      # --- binaries (disabled: re-enable once the image/binary namespace is stable, e.g. after repo transfer) ---
