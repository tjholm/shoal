name: release

# A pushed v* tag builds everything into a draft GitHub Release, which is
# published only once every job succeeds. The desktop updater reads
# releases/latest, so it never sees a release that is missing its files.
#
# Running it by hand (workflow_dispatch) is a dry run: every build runs as
# version 0.0.0, and nothing is published to npm, ghcr.io or GitHub Releases.
# The desktop builds are attached to the run as artifacts instead.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: |
          bunx tsc --noEmit
          bunx tsc --noEmit -p apps/api
          bunx tsc --noEmit -p apps/dashboard
          bunx tsc --noEmit -p apps/web
          bunx tsc --noEmit -p packages/worker-ui
      - name: Test
        run: bun test --pass-with-no-tests
      - name: Test dashboard
        run: bun run --filter @shoal/dashboard test

  create-release:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-cli:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC token for a publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: bun install --frozen-lockfile

      - id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then version=${GITHUB_REF_NAME#v}; else version=0.0.0; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # --- npm bundle ---
      - name: Build npm bundle
        run: |
          mkdir -p dist/npm
          bun build apps/cli/bin.ts \
            --target=node \
            --define __SHOAL_VERSION__='"${{ steps.version.outputs.version }}"' \
            --outfile=dist/npm/shoal.js \
            --minify \
            --banner='#!/usr/bin/env node'
          chmod +x dist/npm/shoal.js
          # `shoal worker start --ui` serves this from beside shoal.js.
          bun run --filter @shoal/worker-ui build
          cp -r packages/worker-ui/dist dist/npm/ui

      - name: Write publish package.json
        run: |
          cat > dist/npm/package.json <<EOF
          {
            "name": "@shoal.school/cli",
            "version": "${{ steps.version.outputs.version }}",
            "license": "Apache-2.0",
            "type": "module",
            "bin": { "shoal": "shoal.js" },
            "engines": { "node": ">=22" },
            "repository": {
              "type": "git",
              "url": "git+${{ github.server_url }}/${{ github.repository }}.git",
              "directory": "apps/cli"
            }
          }
          EOF

      # Authenticates as this workflow through npm trusted publishing. NPM_TOKEN
      # only bootstraps the first publish, before the package exists to attach a
      # trusted publisher to; delete the secret and this env once it's set up.
      - name: Publish to npm
        run: cd dist/npm && npm publish --access public ${{ github.event_name != 'push' && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # --- binaries (disabled: re-enable once the image/binary namespace is stable, e.g. after repo transfer) ---
      # - name: Build binaries
      #   run: |
      #     mkdir -p dist/bin
      #     for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64 bun-windows-x64; do
      #       name=${target#bun-}
      #       ext=""
      #       [[ "$target" == *windows* ]] && ext=".exe"
      #       bun build apps/cli/bin.ts \
      #         --compile \
      #         --target="$target" \
      #         --outfile="dist/bin/shoal-${name}${ext}"
      #     done
      #
      # - uses: softprops/action-gh-release@v2
      #   with:
      #     files: dist/bin/*
      #     generate_release_notes: true

  release-desktop:
    needs: [checks, create-release]
    # create-release is skipped on a dry run; build anyway.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # Hutch only builds for the OS and architecture it runs on.
        runner: [macos-14, ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build
        working-directory: apps/desktop
        # v1.2.3 -> 1.2.3, matching the CLI's version.
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then version=${GITHUB_REF_NAME#v}; else version=0.0.0; fi
          SHOAL_VERSION="$version" bun run build

      - name: Attach builds to the dry run
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runner }}
          path: apps/desktop/artifacts/*

      - name: Upload to the draft release
        if: github.event_name == 'push'
        run: gh release upload "$GITHUB_REF_NAME" apps/desktop/artifacts/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: [release-cli, release-server, release-desktop]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-server:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/shoal" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/api.dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
