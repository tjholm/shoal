name: edge

# Publishes the server image from every push to main, tagged `edge`, `main`
# and `sha-<commit>`. Releases (`v*` tags) publish `latest` from publish.yml.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/web/src/**'
      - 'apps/web/public/**'
      - '**/*.md'
      - '.github/workflows/website.yml'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: |
          bunx tsc --noEmit
          bunx tsc --noEmit -p apps/api
          bunx tsc --noEmit -p apps/dashboard
          bunx tsc --noEmit -p apps/web
          bunx tsc --noEmit -p packages/worker-ui
      - name: Test
        run: bun test --pass-with-no-tests
      - name: Test dashboard
        run: bun run --filter @shoal/dashboard test

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/shoal" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/api.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:edge
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
